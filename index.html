<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catalogue fiches techniques Oricami</title>
<style>
:root{--red:#B70E0C;--grey:#58666D;--bg:#F4F5F6;--card:#FFFFFF;--text:#1F2427;--muted:#58666D;--line:#D5DADD;--label:#EEF0F1;--head:#58666D;--headtext:#FFFFFF;--accent:#B70E0C;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15191B;--card:#1F2528;--text:#E8ECEE;--muted:#A9B4B9;--line:#374146;--label:#2A3236;--head:#58666D;--headtext:#FFFFFF;--accent:#CA6E6E}}
:root[data-theme="dark"]{--bg:#15191B;--card:#1F2528;--text:#E8ECEE;--muted:#A9B4B9;--line:#374146;--label:#2A3236;--head:#58666D;--headtext:#FFFFFF;--accent:#CA6E6E}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,Verdana,Arial,sans-serif;font-size:16px;line-height:1.45}
header.top{background:#FFFFFF;border-bottom:4px solid var(--red);padding:12px 16px}
header.top .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
header.top img{height:46px;width:auto;max-width:100%}
header.top h1{margin:0;font-size:15px;color:#58666D;text-transform:uppercase;letter-spacing:.03em;font-weight:700}
.wrap{max-width:900px;margin:0 auto}
main{padding:16px}
.search{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 0 12px}
.search input{width:100%;font-size:17px;padding:12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-family:inherit}
.search input:focus{outline:none;border-color:var(--red)}
.az{display:flex;flex-wrap:wrap;gap:4px;margin:4px 0 16px}
.az button{min-width:34px;height:34px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:6px;font-weight:700;font-size:14px;cursor:default;font-family:inherit}
.az button.on{background:var(--red);border-color:var(--red);color:#FFF;cursor:pointer}
.msg{background:var(--card);border-left:4px solid var(--grey);padding:14px 16px;border-radius:6px;color:var(--muted)}
.fab{margin:0 0 18px}
.fab h2{margin:0 0 6px;font-size:18px;color:var(--accent);border-bottom:2px solid var(--red);padding-bottom:4px}
.item{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:6px 0;cursor:pointer;color:var(--text);font-family:inherit;font-size:16px}
.item:hover,.item:focus{border-color:var(--red);outline:none}
.item b{display:block;font-size:17px}
.item small{color:var(--muted)}
.back{background:none;border:none;color:var(--accent);font-weight:700;font-size:16px;padding:6px 0 12px;cursor:pointer;font-family:inherit}
.fiche{background:var(--card);border-radius:8px;padding:18px 16px;border:1px solid var(--line)}
.kicker{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase}
.fiche h2.prod{margin:2px 0 2px;font-size:28px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 6px}
.fiche h3{margin:22px 0 8px;font-size:17px;text-transform:uppercase;color:var(--accent);border-bottom:2px solid var(--red);padding-bottom:4px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
td,th{border:1px solid var(--line);padding:8px 10px;vertical-align:middle;text-align:left}
th{background:var(--head);color:var(--headtext);font-size:14px}
td.l{background:var(--label);font-weight:700;width:28%}
ol.steps{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding-left:32px;margin:0 0 10px}
ol.steps li::before{content:counter(s) ".";position:absolute;left:0;top:0;color:var(--accent);font-weight:700}
ol.steps .tw{margin-top:8px}
.foot{margin-top:24px;border-top:1px solid var(--line);padding-top:8px;color:var(--muted);font-size:14px;font-weight:700}
.foot span{font-weight:400;display:block}
.tags{margin-top:6px}
.tag{display:inline-block;font-size:13px;background:var(--label);color:var(--muted);border-radius:12px;padding:2px 10px;margin:2px 4px 2px 0}
@media (max-width:560px){td.l{width:38%}.fiche h2.prod{font-size:24px}}
</style>
</head>

 <div id="detail" hidden></div>
</main>
<script>
(function(){
 var fiches=[], ready=false;
 var $=function(id){return document.getElementById(id)};
 function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
 function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}
 function first(s){var c=norm(s).charAt(0).toUpperCase();return /[A-Z]/.test(c)?c:'#'}
 function flat(f){var parts=[f.fabricant,f.produit,f.reference,f.sousTitre].concat(f.motsCles||[]);
  (f.rubriques||[]).forEach(function(r){parts.push(r.titre);(r.lignes||[]).forEach(function(l){parts.push(l.join(' '))});
   (r.etapes||[]).forEach(function(e){parts.push(e.titre,e.texte);if(e.tableau){(e.tableau.lignes||[]).forEach(function(l){parts.push(l.join(' '))})}})});
  return norm(parts.join(' '))}
 function msg(t){var r=$('results');r.textContent='';r.appendChild(el('div','msg',t))}
 function renderAZ(){var az=$('az');az.textContent='';var have={};fiches.forEach(function(f){have[first(f.fabricant)]=1});
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(function(L){var b=el('button',have[L]?'on':'',L);b.type='button';b.disabled=!have[L];
   if(have[L])b.onclick=function(){var t=document.querySelector('[data-letter="'+L+'"]');$('q').value='';renderList();t=document.querySelector('[data-letter="'+L+'"]');if(t)t.scrollIntoView({behavior:'smooth',block:'start'})};az.appendChild(b)})}
 function renderList(){if(!ready)return;var q=norm($('q').value).trim();var r=$('results');r.textContent='';
  if(!fiches.length){msg('Le catalogue ne contient encore aucune fiche validée.');return}
  var terms=q?q.split(/\s+/):[];var list=fiches.filter(function(f){if(!terms.length)return true;var h=flat(f);return terms.every(function(t){return h.indexOf(t)>=0})});
  if(!list.length){msg('Aucune fiche ne correspond à cette recherche.');return}
  var groups={};list.forEach(function(f){(groups[f.fabricant]=groups[f.fabricant]||[]).push(f)});
  Object.keys(groups).sort(function(a,b){return a.localeCompare(b,'fr',{sensitivity:'base'})}).forEach(function(fab){
   var g=el('section','fab');g.setAttribute('data-letter',first(fab));g.appendChild(el('h2',null,fab));
   groups[fab].sort(function(a,b){return a.produit.localeCompare(b.produit,'fr',{sensitivity:'base'})}).forEach(function(f){
    var b=el('button','item');b.type='button';b.appendChild(el('b',null,f.produit));b.appendChild(el('small',null,[f.sousTitre,(f.motsCles||[]).join(', ')].filter(Boolean).join(' · ')));
    b.onclick=function(){show(f)};g.appendChild(b)});r.appendChild(g)})}
 function mkTable(head,rows,labelFirst){var w=el('div','tw');var t=el('table');if(head){var tr=el('tr');head.forEach(function(h){tr.appendChild(el('th',null,h))});t.appendChild(tr)}
  rows.forEach(function(row){var tr=el('tr');row.forEach(function(c,i){tr.appendChild(el('td',(labelFirst&&i==0)||(head&&i==0)?'l':null,c))});t.appendChild(tr)});w.appendChild(t);return w}
 function show(f){var d=$('detail');d.textContent='';var back=el('button','back','← Retour au catalogue');back.type='button';back.onclick=function(){d.hidden=true;$('list').hidden=false;window.scrollTo(0,0)};d.appendChild(back);
  var c=el('article','fiche');c.appendChild(el('div','kicker',f.entete||'FICHE ORICAMI · DEVIS ET CHANTIER'));c.appendChild(el('h2','prod',f.produit));
  c.appendChild(el('p','sub',[f.sousTitre,f.fabricant,f.dateSynthese?'Fiche du '+f.dateSynthese:''].filter(Boolean).join(' · ')));
  (f.rubriques||[]).forEach(function(r){c.appendChild(el('h3',null,r.titre));if(r.lignes)c.appendChild(mkTable(null,r.lignes,true));
   if(r.etapes){var ol=el('ol','steps');r.etapes.forEach(function(e){var li=el('li');li.appendChild(el('b',null,e.titre));if(e.texte)li.appendChild(document.createTextNode(' '+e.texte));
    if(e.tableau)li.appendChild(mkTable(e.tableau.entetes,e.tableau.lignes,false));ol.appendChild(li)});c.appendChild(ol)}});
  if(f.pointsVigilance&&f.pointsVigilance.length){c.appendChild(el('h3',null,'Points de vigilance'));var u=el('ul');f.pointsVigilance.forEach(function(p){u.appendChild(el('li',null,p))});c.appendChild(u)}
  if(f.informationsAbsentes&&f.informationsAbsentes.length){c.appendChild(el('h3',null,'Informations absentes de la fiche'));var u2=el('ul');f.informationsAbsentes.forEach(function(p){u2.appendChild(el('li',null,p))});c.appendChild(u2)}
  var ft=el('div','foot',f.mention||'Fiche Oricami.');if(f.dateValidation)ft.appendChild(el('span',null,'Validée le '+f.dateValidation));
  if(f.motsCles&&f.motsCles.length){var tg=el('div','tags');f.motsCles.forEach(function(k){tg.appendChild(el('span','tag',k))});ft.appendChild(tg)}
  c.appendChild(ft);d.appendChild(c);$('list').hidden=true;d.hidden=false;window.scrollTo(0,0)}
 $('q').addEventListener('input',renderList);
 fetch('fiches.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()}).then(function(data){
  var arr=Array.isArray(data)?data:(data&&data.fiches)||[];ready=true;
  fiches=arr.filter(function(f){return f&&f.fabricant&&f.produit});
  renderAZ();renderList()
 }).catch(function(){msg('Catalogue inaccessible pour le moment. Rechargez la page.')});
})();
</script>
</body>
</html>
